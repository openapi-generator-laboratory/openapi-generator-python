[metadata]
name = openapi_server
version = 1.0.0
description = 对 Kubernetes 集群中的 Deployment 资源进行增删改查与扩缩容的 REST 接口。  本文件是「唯一事实来源」：接口代码由 OpenAPI Generator（python-fastapi）从它生成， 接口定义变更时请改这里，然后重新执行 &#x60;scripts/generate&#x60; 脚本，不要手改生成物。 
long_description = file: README.md
keywords = OpenAPI Kubernetes Deployment 管理 API
python_requires = >= 3.10.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[options]
install_requires = fastapi[all]
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src
